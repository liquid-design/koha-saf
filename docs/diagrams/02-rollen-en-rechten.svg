.th { font: 500 14px "Anthropic Sans", sans-serif; }
.role-admin-bg { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
.role-staff-bg { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.role-lezer-bg { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
