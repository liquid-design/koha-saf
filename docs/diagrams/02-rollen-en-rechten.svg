<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 540" role="img">
<title>De drie rollen en hun rechten in Koha</title>
<desc>Admin, staff en lezer met de modules waar elk wel of geen toegang toe heeft.</desc>

<defs>
<style>
.t { font: 500 14px "Anthropic Sans", sans-serif; }
