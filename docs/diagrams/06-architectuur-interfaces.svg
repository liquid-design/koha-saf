<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 460" role="img">
<title>Koha-architectuur: twee interfaces, één database</title>
<desc>Staff-interface en OPAC zijn aparte websites die met dezelfde Koha-database praten. Welke rol gebruikt welke deur.</desc>

<defs>
<style>
.t { font: 500 14px "Anthropic Sans", sans-serif; fill: #2C2C2A; }
.ts { font: 400 12px "Anthropic Sans", sans-serif; fill: #5F5E5A; }
.th { font: 500 14px "Anthropic Sans", sans-serif; fill: #2C2C2A; }
.code { font: 500 12px ui-monospace, monospace; fill: #2C2C2A; }
.code-light { font: 500 12px ui-monospace, monospace; fill: #5F5E5A; }

.role-admin-bg { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
.role-admin-text { fill: #633806; }

.role-staff-bg { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.role-staff-text { fill: #085041; }

.role-lezer-bg { fill: #E6F1FB; stroke: #185FA5; stroke-width: 0.5; }
.role-lezer-text { fill: #0C447C; }

.iface-bg { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 1; }

.db-bg { fill: #EEEDFE; stroke: #534AB7; stroke-width: 1; }
.db-text { fill: #26215C; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="40" y="34">Twee interfaces, één database</text>
<text class="ts" x="40" y="54">Welke deur gebruikt welke rol?</text>

<rect class="role-admin-bg" x="40" y="80" width="160" height="50" rx="8"/>
<text class="th role-admin-text" x="120" y="98" text-anchor="middle" dominant-baseline="central">Admin</text>
<text class="ts role-admin-text" x="120" y="116" text-anchor="middle" dominant-baseline="central">kohaadmin</text>

<rect class="role-staff-bg" x="260" y="80" width="160" height="50" rx="8"/>
<text class="th role-staff-text" x="340" y="98" text-anchor="middle" dominant-baseline="central">Staff</text>
<text class="ts role-staff-text" x="340" y="116" text-anchor="middle" dominant-baseline="central">categorie S + flags</text>

<rect class="role-lezer-bg" x="480" y="80" width="160" height="50" rx="8"/>
<text class="th role-lezer-text" x="560" y="98" text-anchor="middle" dominant-baseline="central">Lezer</text>
<text class="ts role-lezer-text" x="560" y="116" text-anchor="middle" dominant-baseline="central">categorie A of J</text>

<rect class="iface-bg" x="40" y="190" width="380" height="100" rx="10"/>
<text class="th" x="60" y="214" dominant-baseline="central">Staff-interface (Intranet)</text>
<text class="code" x="60" y="238" dominant-baseline="central">https://bib-intra.marxisme.be</text>
<text class="code-light" x="60" y="258" dominant-baseline="central">https://bib-test-intra.marxisme.be</text>
<text class="ts" x="60" y="278" dominant-baseline="central">Vereist: catalogue-flag minimaal. Login = userid + password.</text>

<rect class="iface-bg" x="460" y="190" width="180" height="100" rx="10"/>
<text class="th" x="480" y="214" dominant-baseline="central">OPAC</text>
<text class="code" x="480" y="238" dominant-baseline="central">https://bib.marxisme.be</text>
<text class="code-light" x="480" y="258" dominant-baseline="central">https://bib-test...</text>
<text class="ts" x="480" y="278" dominant-baseline="central">Open zonder login,</text>
<text class="ts" x="480" y="294" dominant-baseline="central">login optioneel.</text>

<line x1="120" y1="130" x2="120" y2="188" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="130" x2="340" y2="188" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="130" x2="560" y2="188" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect class="db-bg" x="200" y="370" width="280" height="60" rx="10"/>
<text class="th db-text" x="340" y="390" text-anchor="middle" dominant-baseline="central">Koha database (MariaDB)</text>
<text class="ts db-text" x="340" y="410" text-anchor="middle" dominant-baseline="central">Patrons, items, leningen, holds, regels</text>

<line x1="230" y1="290" x2="280" y2="368" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="290" x2="400" y2="368" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="450">Beide interfaces draaien als aparte Apache vhosts; ze delen exact dezelfde database.</text>
</svg>
