<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 580" role="img">
<title>State machine van een exemplaar in Koha</title>
<desc>Status-overgangen van een boek: Available, Checked out, On hold waiting, In transit, Lost — met de overgangs-acties.</desc>

<defs>
<style>
.t { font: 500 14px "Anthropic Sans", sans-serif; }
.ts { font: 400 12px "Anthropic Sans", sans-serif; }
.th { font: 500 14px "Anthropic Sans", sans-serif; }
.label { font: 400 11px "Anthropic Sans", sans-serif; fill: #2C2C2A; }
.label-bg { fill: #FAFAF7; stroke: none; }

.state-available { fill: #EAF3DE; stroke: #639922; stroke-width: 1; }
.state-checkedout { fill: #FAEEDA; stroke: #BA7517; stroke-width: 1; }
.state-onhold { fill: #EEEDFE; stroke: #7F77DD; stroke-width: 1; }
.state-transit { fill: #E6F1FB; stroke: #378ADD; stroke-width: 1; }
.state-lost { fill: #FCEBEB; stroke: #E24B4A; stroke-width: 1; }

.t-available { fill: #173404; }
.t-available-sub { fill: #3B6D11; }
.t-checkedout { fill: #633806; }
.t-checkedout-sub { fill: #854F0B; }
.t-onhold { fill: #26215C; }
.t-onhold-sub { fill: #3C3489; }
.t-transit { fill: #042C53; }
.t-transit-sub { fill: #0C447C; }
.t-lost { fill: #501313; }
.t-lost-sub { fill: #791F1F; }

.title-text { fill: #2C2C2A; }
.title-sub { fill: #5F5E5A; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th title-text" x="40" y="34">Status-overgangen van één exemplaar</text>
<text class="ts title-sub" x="40" y="54">Doorgetrokken pijl = standaard pad. Stippellijn = uitzondering / herstel.</text>

<!-- On hold (top center) -->
<rect class="state-onhold" x="260" y="100" width="160" height="60" rx="10"/>
<text class="th t-onhold" x="340" y="122" text-anchor="middle" dominant-baseline="central">On hold (waiting)</text>
<text class="ts t-onhold-sub" x="340" y="142" text-anchor="middle" dominant-baseline="central">Klaar voor afhalen</text>

<!-- Available (left) -->
<rect class="state-available" x="40" y="280" width="160" height="60" rx="10"/>
<text class="th t-available" x="120" y="302" text-anchor="middle" dominant-baseline="central">Available</text>
<text class="ts t-available-sub" x="120" y="322" text-anchor="middle" dominant-baseline="central">Op de plank</text>

<!-- Checked out (center) -->
<rect class="state-checkedout" x="260" y="280" width="160" height="60" rx="10"/>
<text class="th t-checkedout" x="340" y="302" text-anchor="middle" dominant-baseline="central">Checked out</text>
<text class="ts t-checkedout-sub" x="340" y="322" text-anchor="middle" dominant-baseline="central">Bij de lezer</text>

<!-- In transit (right) -->
<rect class="state-transit" x="480" y="280" width="160" height="60" rx="10"/>
<text class="th t-transit" x="560" y="302" text-anchor="middle" dominant-baseline="central">In transit</text>
<text class="ts t-transit-sub" x="560" y="322" text-anchor="middle" dominant-baseline="central">Tussen vestigingen</text>

<!-- Lost (bottom) -->
<rect class="state-lost" x="260" y="460" width="160" height="60" rx="10"/>
<text class="th t-lost" x="340" y="482" text-anchor="middle" dominant-baseline="central">Lost</text>
<text class="ts t-lost-sub" x="340" y="502" text-anchor="middle" dominant-baseline="central">Verloren / niet terug</text>

<!-- Available <-> Checked out (uitlenen / inname) - parallel arrows -->
<line x1="200" y1="302" x2="258" y2="302" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="206" y="288" width="48" height="14" rx="3"/>
<text class="label" x="230" y="298" text-anchor="middle" dominant-baseline="central">uitlenen</text>

<line x1="258" y1="324" x2="200" y2="324" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="210" y="328" width="40" height="14" rx="3"/>
<text class="label" x="230" y="338" text-anchor="middle" dominant-baseline="central">inname</text>

<!-- Available -> On hold (curve from Available going up-right to bottom-left of On hold) -->
<path d="M150 280 Q150 200 268 158" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="42" y="218" width="180" height="14" rx="3"/>
<text class="label" x="132" y="228" text-anchor="middle" dominant-baseline="central">inname met openstaande hold</text>

<!-- On hold -> Checked out (straight down) -->
<line x1="340" y1="160" x2="340" y2="278" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="350" y="212" width="120" height="14" rx="3"/>
<text class="label" x="410" y="222" text-anchor="middle" dominant-baseline="central">lezer haalt af + uitlenen</text>

<!-- Checked out -> In transit (top half of edge) -->
<line x1="420" y1="295" x2="478" y2="295" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="425" y="276" width="68" height="14" rx="3"/>
<text class="label" x="459" y="286" text-anchor="middle" dominant-baseline="central">verzending</text>

<!-- In transit -> Available (route below: down, left, up) -->
<path d="M560 340 L560 400 L120 400 L120 340" fill="none" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="200" y="392" width="200" height="14" rx="3"/>
<text class="label" x="300" y="402" text-anchor="middle" dominant-baseline="central">aangekomen op bestemming</text>

<!-- Checked out -> Lost (down) -->
<line x1="380" y1="340" x2="380" y2="458" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect class="label-bg" x="390" y="430" width="124" height="14" rx="3"/>
<text class="label" x="452" y="440" text-anchor="middle" dominant-baseline="central">na X dagen overdue</text>

<!-- Lost -> Available (dashed curve via far left) -->
<path d="M260 490 Q40 490 40 340" fill="none" stroke="#444441" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect class="label-bg" x="42" y="480" width="120" height="14" rx="3"/>
<text class="label" x="102" y="490" text-anchor="middle" dominant-baseline="central">alsnog terugbezorgd</text>

<text class="ts title-sub" x="40" y="555">Multi-vestiging is niet actief in dit project; In transit is voorbereid maar wordt nu niet gebruikt.</text>
</svg>
