# Koha instance bib Apache config.

# OPAC redirect
<VirtualHost *:80>
   ServerName bib.marxisme.be
   RewriteEngine On
   RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# Intranet redirect
<VirtualHost *:80>
   ServerName bib-intra.marxisme.be
   RewriteEngine On
   RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
</VirtualHost>

