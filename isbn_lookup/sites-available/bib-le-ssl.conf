<IfModule mod_ssl.c>
<VirtualHost *:443>
  <IfVersion >= 2.4>
   Define instance "bib"
  </IfVersion>
   Include /etc/koha/apache-shared.conf
#  Include /etc/koha/apache-shared-disable.conf
  Include /etc/koha/apache-shared-opac-plack.conf
   Include /etc/koha/apache-shared-opac.conf

   ServerName bib.marxisme.be
   SetEnv KOHA_CONF "/etc/koha/sites/bib/koha-conf.xml"
   AssignUserID bib-koha bib-koha

   ErrorLog    /var/log/koha/bib/opac-error.log
#  TransferLog /var/log/koha/bib/opac-access.log


Include /etc/letsencrypt/options-ssl-apache.conf
ServerAlias bib-intra.marxisme.be
SSLCertificateFile /etc/letsencrypt/live/bib-intra.marxisme.be/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/bib-intra.marxisme.be/privkey.pem
</VirtualHost>
</IfModule>
<IfModule mod_ssl.c>
<VirtualHost *:80>
  <IfVersion >= 2.4>
   Define instance "bib"
  </IfVersion>
   Include /etc/koha/apache-shared.conf
#  Include /etc/koha/apache-shared-disable.conf
  Include /etc/koha/apache-shared-intranet-plack.conf
   Include /etc/koha/apache-shared-intranet.conf

   ServerName bib-intra.marxisme.be
   SetEnv KOHA_CONF "/etc/koha/sites/bib/koha-conf.xml"
   AssignUserID bib-koha bib-koha

   ErrorLog    /var/log/koha/bib/intranet-error.log
#  TransferLog /var/log/koha/bib/intranet-access.log

</VirtualHost>
</IfModule>
