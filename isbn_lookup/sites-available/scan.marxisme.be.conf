<VirtualHost *:80>
    ServerName scan.marxisme.be

    # Redirect alles naar HTTPS
    Redirect "/" "https://scan.marxisme.be/"

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =scan.marxisme.be
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName scan.marxisme.be

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/scan-marxisme_error.log
    CustomLog ${APACHE_LOG_DIR}/scan-marxisme_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/scan.marxisme.be/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/scan.marxisme.be/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
