# ============================================================================
# Apache TLS hardening — Mozilla modern profile (mei 2026)
# Managed by Ansible (apache_hardening role) — niet handmatig editen.
# ----------------------------------------------------------------------------
# Variant met TLS 1.3-only. Alleen activeren als je zeker weet dat geen
# enkele client TLS 1.2 nodig heeft. Voor een publieke bibliotheek-OPAC
# raden we dit NIET aan (oude Android, oude e-readers).
#
# Activeer door in group_vars te zetten:
#   apache_hardening_tls_profile: modern
# ============================================================================

SSLProtocol                 all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1 -TLSv1.2
SSLHonorCipherOrder         off
SSLSessionTickets           off
SSLOptions                  +StrictRequire
SSLOpenSSLConfCmd           Curves X25519:secp256r1:secp384r1
