# ============================================================================
# Apache security headers — gedeeld over alle Koha vhosts
# Managed by Ansible (apache_hardening role) — niet handmatig editen.
# ----------------------------------------------------------------------------
# Doel: één plek voor alle headers die voor alle Koha vhosts (OPAC + intranet)
# identiek moeten zijn. Voorkomt drift tussen OPAC en intranet templates.
#
# Includen vanuit elke Koha vhost met:
#   Include /etc/apache2/conf-available/security-headers.conf
#
# Bewust NIET in deze gedeelde set:
#   - Content-Security-Policy (Koha heeft veel inline JS; CSP breekt dingen)
#     Voor de scan-app heeft die wèl een strikte CSP omdat die zelf-geschreven
#     is en gecontroleerd kan worden.
#   - HSTS preload (zolang niet alle subdomains gegarandeerd TLS hebben)
#
# BEKENDE BEPERKING:
# Koha's Perl-applicatie (Plack/C4::Output) zet zelf ook X-Frame-Options
# op responses. Dat resulteert in een dubbele header (twee keer SAMEORIGIN).
# `Header always unset` werkt niet op upstream/Plack headers, alleen op
# Apache's eigen header-table. Koha patchen zou upgrades breken. Conclusie:
# dubbele header is cosmetisch geaccepteerd, geen security-issue (zelfde
# waarde, browsers respecteren correct). securityheaders.com noemt het als
# warning maar haalt onze grade niet onder A.
# ============================================================================


# HSTS: 2 jaar, includeSubDomains. Geen 'preload' tot we daar bewust voor
# kiezen (eenmaal in HSTS preload-list is uitzetten ZEER moeilijk).
Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"

# Clickjacking-bescherming. SAMEORIGIN ipv DENY zodat Koha's eigen iframe-
# previews (cover-art viewers e.d.) blijven werken.
# Zie bekende beperking bovenaan dit bestand voor de dubbele-header context.
Header always set X-Frame-Options "SAMEORIGIN"

# MIME-type sniffing uit. Voorkomt dat browsers een geüploade .txt als
# HTML/JS gaan renderen.
Header always set X-Content-Type-Options "nosniff"

# Referrer: geen cross-origin full URL leak. Behoudt same-origin info voor
# Koha's eigen navigatie/analytics.
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Permissions-Policy: schakel browser-API's uit die Koha niet nodig heeft.
# 'interest-cohort=()' opt-out van FLoC/Topics tracking.
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Cross-origin isolation: voorkomt dat andere origins resources van ons
# kunnen embedden of openen in een window-with-opener.
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"