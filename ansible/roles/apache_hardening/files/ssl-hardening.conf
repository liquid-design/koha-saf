# ============================================================================
# Apache TLS hardening — Mozilla intermediate profile (mei 2026)
# Managed by Ansible (apache_hardening role) — niet handmatig editen.
# ----------------------------------------------------------------------------
# Doel: expliciete TLS-config ipv de OpenSSL system defaults.
#
# Effect op SSL Labs / nmap:
#   - alleen TLS 1.2 en 1.3
#   - alleen AEAD ciphers (GCM, CHACHA20-POLY1305) — geen CBC, geen ARIA,
#     geen Camellia
#   - X25519 als primaire curve (snel + modern), daarna NIST P-256 en P-384
#   - server-side ticket reuse uit (forward secrecy garantie)
#
# Geldt globaal voor alle vhosts op deze server (ook scan-app, intranet).
# Wordt geactiveerd via `a2enconf ssl-hardening`.
#
# Voor PQC (X25519MLKEM768) is OpenSSL 3.5+ nodig — Debian 12 heeft 3.0,
# dus dat komt pas bij upgrade naar Debian 13 (Trixie) of via backports.
# ============================================================================

# Geen TLS 1.0/1.1, alleen 1.2 en 1.3.
SSLProtocol                 all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1

# TLS 1.2 cipher suite (Mozilla intermediate, alleen AEAD).
# TLS 1.3 ciphers worden niet door SSLCipherSuite gestuurd; OpenSSL kiest
# automatisch uit TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256 en
# TLS_AES_128_GCM_SHA256 — allemaal veilig.
SSLCipherSuite              ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305

# Server-side cipher ordering uit: clients mogen kiezen uit de toegestane
# suites. Geeft snellere clients (ChaCha20 op mobiel) een betere ervaring.
SSLHonorCipherOrder         off

# Geen TLS session tickets — sluit een klasse van ticket-key reuse aanvallen
# uit. Performance-impact verwaarloosbaar bij Koha's volume.
SSLSessionTickets           off

# Verplicht dat clients de SSL handshake netjes afronden.
SSLOptions                  +StrictRequire

# Expliciete curve-volgorde: X25519 voorop. secp384r1 als fallback voor
# clients die geen X25519 doen (zeldzaam in 2026).
SSLOpenSSLConfCmd           Curves X25519:secp256r1:secp384r1
