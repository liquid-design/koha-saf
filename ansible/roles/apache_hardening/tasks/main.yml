# ============================================================================
# ROLE: apache_hardening
# ----------------------------------------------------------------------------
# Verantwoordelijkheid:
# Globale Apache TLS- en security-header-config plaatsen en activeren.
#
# Doet wel:
# - SSL-hardening snippet in /etc/apache2/conf-available/
# - Shared security-headers snippet in /etc/apache2/conf-available/
# - Activeren beide via a2enconf
# - Reload Apache na config-validatie
#
# Doet niet:
# - vhosts aanmaken (zie koha_apache-tls en koha_apache-tls-finalize)
# - certbot (zie certbot role)
# - SSH (zie ssh_hardening)
# - firewall (DO firewall via Terraform)
#
# IDEMPOTENT:
# - copy modules zijn idempotent op content
# - a2enconf gebruikt `creates:` zodat hij niet onnodig draait
# - reload alleen bij wijziging via handler
#
# VEILIGHEID:
# Het `validate:` veld op de copy-tasks zou ideaal `apache2ctl configtest`
# draaien op de nieuwe file, maar dat werkt niet goed met losse snippets
# (config is pas geldig na include). We doen daarom een configtest in de
# handler vóór de reload. Faalt de handler, dan blijft Apache draaien met
# de oude (werkende) config.
# ============================================================================

# ---- 1. SSL-hardening snippet ----
# We kiezen tussen intermediate (default) en modern via een variabele.
# Modern = TLS 1.3 only, niet aanbevolen voor publieke OPAC.

- name: Deploy SSL-hardening snippet (intermediate profile)
  ansible.builtin.copy:
    src: ssl-hardening.conf
    dest: "{{ apache_hardening_ssl_conf_path }}"
    owner: root
    group: root
    mode: '0644'
  when: apache_hardening_tls_profile == "intermediate"
  notify: validate and reload apache

- name: Deploy SSL-hardening snippet (modern profile - TLS 1.3 only)
  ansible.builtin.copy:
    src: ssl-hardening-modern.conf
    dest: "{{ apache_hardening_ssl_conf_path }}"
    owner: root
    group: root
    mode: '0644'
  when: apache_hardening_tls_profile == "modern"
  notify: validate and reload apache

- name: Fail on onbekend TLS profile
  ansible.builtin.fail:
    msg: |
      apache_hardening_tls_profile moet 'intermediate' of 'modern' zijn,
      kreeg '{{ apache_hardening_tls_profile }}'.
  when: apache_hardening_tls_profile not in ['intermediate', 'modern']

- name: Enable SSL-hardening conf
  ansible.builtin.command: a2enconf ssl-hardening
  args:
    creates: /etc/apache2/conf-enabled/ssl-hardening.conf
  notify: validate and reload apache

# ---- 2. Shared security headers snippet ----

- name: Deploy security-headers snippet
  ansible.builtin.copy:
    src: security-headers.conf
    dest: "{{ apache_hardening_headers_conf_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: validate and reload apache

- name: Enable security-headers conf
  ansible.builtin.command: a2enconf security-headers
  args:
    creates: /etc/apache2/conf-enabled/security-headers.conf
  notify: validate and reload apache

# ---- 3. Apache modules die we nodig hebben ----
# headers is meestal al aan door koha_apache, maar we zijn defensief.

- name: Ensure required Apache modules are enabled
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - ssl
    - headers
  notify: validate and reload apache

# ---- 4. Server-tokens hardening ----
# ServerTokens en ServerSignature zijn directives die Apache vroeg in zijn
# config-cyclus parsed. Plaatsen in een `conf-available/` snippet (zoals
# security-headers.conf) werkt NIET betrouwbaar omdat Debian's security.conf
# de waarde later in de alfabetische load-order al heeft gezet en Apache
# die eerste evaluatie aanhoudt.
#
# We passen daarom de bestaande Debian security.conf aan via lineinfile.
# Idempotent: bij re-runs ziet Ansible dat de juiste waarde al staat en
# rapporteert 'ok'. Bij een Apache-package upgrade kan dpkg vragen wat te
# doen — meestal kun je "keep your version" kiezen.

- name: Set ServerTokens to Prod (hide Apache version in Server header)
  ansible.builtin.lineinfile:
    path: /etc/apache2/conf-available/security.conf
    regexp: '^\s*ServerTokens\s+'
    line: 'ServerTokens Prod'
    state: present
  notify: validate and reload apache

- name: Set ServerSignature to Off (no Apache footer on error pages)
  ansible.builtin.lineinfile:
    path: /etc/apache2/conf-available/security.conf
    regexp: '^\s*ServerSignature\s+'
    line: 'ServerSignature Off'
    state: present
  notify: validate and reload apache