{% extends "base.html" %}
{% block title %}Opgeslagen — {{ isbn }}{% endblock %}

{% block content %}
  <div class="saved">
    <h2>✓ MARCXML opgeslagen</h2>
    <p>
      Bestand: <code>{{ marcfile }}</code>
    </p>
    <p>
      De cron-job pikt dit binnen 1 minuut op en importeert het in Koha.
    </p>

    <div class="actions">
      <a href="{{ url_for('index') }}" class="btn-primary">
        + Volgende ISBN scannen
      </a>
    </div>
  </div>
{% endblock %}
