# ============================================================================
# flask_isbn_app role
# ----------------------------------------------------------------------------
# Installeert de Flask ISBN-scan app als systemd service achter Apache.
# Architectuur:
#   - Flask draait als 'flask-isbn' user, gunicorn op 127.0.0.1:5000
#   - Flask schrijft XML naar /var/lib/koha-staging/ (niet rechtstreeks naar
#     Koha's upload-dir)
#   - Beide users (flask-isbn + bib-koha) zitten in group 'koha-import'
#   - SetGID bit (mode 2775) zorgt dat nieuwe bestanden de juiste group erven
#   - Apache reverse proxy op scan.<domain> -> 127.0.0.1:5000
#   - Basic Auth op Apache-niveau (htpasswd uit vault)
#
# Gebruik: ansible-playbook -i inventory/terraform.py -l test playbooks/10-flask-isbn.yml
# ============================================================================

# ----------------------------------------------------------------------------
# 1. System packages
# ----------------------------------------------------------------------------
- name: Install Python en venv ondersteuning
  apt:
    name:
      - python3
      - python3-venv
      - python3-pip
      # passlib nodig voor Ansible htpasswd module (we genereren niet zelf,
      # maar het is goed om de dep expliciet te installeren)
      - python3-passlib
      # apache2-utils geeft ons het 'htpasswd' commando — handig voor
      # operationele taken (nieuwe user toevoegen aan htpasswd file)
      - apache2-utils
    state: present

# ----------------------------------------------------------------------------
# 2. Users en groups
# ----------------------------------------------------------------------------
- name: Maak shared group koha-import aan
  group:
    name: "{{ koha_import_group }}"
    state: present
    system: true

- name: Maak primary group flask-isbn aan
  group:
    name: "{{ flask_group }}"
    state: present
    system: true

- name: Maak system user flask-isbn aan
  user:
    name: "{{ flask_user }}"
    group: "{{ flask_group }}"
    groups: "{{ koha_import_group }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ flask_app_dir }}"
    create_home: false
    state: present

- name: Voeg bib-koha user toe aan koha-import group
  user:
    name: "{{ koha_user }}"
    groups: "{{ koha_import_group }}"
    append: true
  notify: restart flask isbn

# ----------------------------------------------------------------------------
# 3. Directories
# ----------------------------------------------------------------------------
- name: Maak app-dir aan
  file:
    path: "{{ flask_app_dir }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: '0755'

# Staging-dir: setgid bit zorgt dat nieuwe files de group erven van de dir.
- name: Maak staging directory aan met setgid bit
  file:
    path: "{{ flask_staging_dir }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ koha_import_group }}"
    mode: '2775'

# ----------------------------------------------------------------------------
# 4. App-bestanden deployen
# ----------------------------------------------------------------------------
- name: Deploy run.py
  copy:
    src: run.py
    dest: "{{ flask_app_dir }}/run.py"
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: '0644'
  notify: restart flask isbn

- name: Deploy requirements.txt
  copy:
    src: requirements.txt
    dest: "{{ flask_app_dir }}/requirements.txt"
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: '0644'

- name: Deploy app package (recursief)
  copy:
    src: app/
    dest: "{{ flask_app_dir }}/app/"
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: '0644'
    directory_mode: '0755'
  notify: restart flask isbn

- name: Zet directory permissies in app/
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: '0755'
  loop:
    - "{{ flask_app_dir }}/app"
    - "{{ flask_app_dir }}/app/sources"
    - "{{ flask_app_dir }}/app/templates"
    - "{{ flask_app_dir }}/app/static"
    - "{{ flask_app_dir }}/app/static/css"
    - "{{ flask_app_dir }}/app/static/js"

- name: Verwijder verouderde isbn_lookup.py uit vorige deploy
  file:
    path: "{{ flask_app_dir }}/isbn_lookup.py"
    state: absent
  notify: restart flask isbn

# Oude .flask_env (van vorige systemd unit) opruimen — niet meer nodig
# omdat we LoadCredential gebruiken ipv EnvironmentFile.
- name: Verwijder verouderde .flask_env uit vorige deploy
  file:
    path: "{{ flask_app_dir }}/.flask_env"
    state: absent

# ----------------------------------------------------------------------------
# 5. Python virtual environment
# ----------------------------------------------------------------------------
- name: Maak Python venv aan
  command: "python3 -m venv {{ flask_venv_dir }}"
  args:
    creates: "{{ flask_venv_dir }}/bin/python"
  become_user: "{{ flask_user }}"

- name: Upgrade pip in venv
  pip:
    name:
      - pip
      - setuptools
      - wheel
    state: latest
    virtualenv: "{{ flask_venv_dir }}"
  become_user: "{{ flask_user }}"

- name: Installeer Python requirements in venv
  pip:
    requirements: "{{ flask_app_dir }}/requirements.txt"
    virtualenv: "{{ flask_venv_dir }}"
  become_user: "{{ flask_user }}"
  notify: restart flask isbn

- name: Installeer gunicorn in venv
  pip:
    name: gunicorn
    virtualenv: "{{ flask_venv_dir }}"
  become_user: "{{ flask_user }}"
  notify: restart flask isbn

# ----------------------------------------------------------------------------
# 6. Flask secret key + systemd service
# ----------------------------------------------------------------------------
# Secret wordt eenmalig gegenereerd. Bij rotatie: verwijder .flask_secret
# en deploy opnieuw — service-restart maakt een nieuwe en breekt actieve
# sessies, wat acceptabel is voor deze interne tool.
- name: Genereer Flask secret key (eenmalig)
  shell: "umask 077 && openssl rand -hex 32 > {{ flask_app_dir }}/.flask_secret"
  args:
    creates: "{{ flask_app_dir }}/.flask_secret"

- name: Beveilig flask secret file
  file:
    path: "{{ flask_app_dir }}/.flask_secret"
    owner: "{{ flask_user }}"
    group: "{{ flask_group }}"
    mode: '0600'

- name: Deploy systemd unit voor flask-isbn
  template:
    src: flask-isbn.service.j2
    dest: /etc/systemd/system/flask-isbn.service
    mode: '0644'
  notify:
    - reload systemd
    - restart flask isbn

- name: Enable en start flask-isbn service
  systemd:
    name: flask-isbn
    enabled: true
    state: started
    daemon_reload: true

# ----------------------------------------------------------------------------
# 7. Apache reverse proxy + Basic Auth
# ----------------------------------------------------------------------------
- name: Enable Apache proxy en auth modules
  command: "a2enmod {{ item }}"
  args:
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop:
    - proxy
    - proxy_http
    - rewrite
    - headers
    - ssl
    - auth_basic         # Basic Auth provider
    - authn_file         # leest passwords uit file
    - authz_user         # 'Require valid-user'
  notify: reload apache

# ---- htpasswd file uit vault ----
# We schrijven het bcrypt-gehashte wachtwoord rechtstreeks. Hash wordt
# OFFLINE gegenereerd en in vault.yml gezet (zie doc 24):
#   htpasswd -nbB saf 'echt-wachtwoord'
# Output is "saf:$2y$05$...". Die hele regel komt in vault_flask_htpasswd_hash.
#
# Voordeel boven 'community.general.htpasswd': geen python-passlib nodig op
# control node, geen platte tekst in Ansible-vars.
- name: Schrijf htpasswd file voor Basic Auth
  copy:
    content: "{{ flask_htpasswd_hash }}\n"
    dest: "{{ flask_htpasswd_path }}"
    owner: root
    group: www-data
    mode: '0640'
  notify: reload apache

- name: Verkrijg TLS certificaat voor scan-domein
  command: >
    certbot certonly
    --apache
    -n
    --agree-tos
    --email {{ letsencrypt_email }}
    -d {{ scan_domain }}
  args:
    creates: "/etc/letsencrypt/live/{{ scan_domain }}"

- name: Deploy Apache vhost voor scan-domein
  template:
    src: scan-vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ scan_domain }}.conf"
    mode: '0644'
  notify: reload apache

- name: Enable scan vhost
  command: "a2ensite {{ scan_domain }}.conf"
  args:
    creates: "/etc/apache2/sites-enabled/{{ scan_domain }}.conf"
  notify: reload apache

- name: Disable automatische certbot vhost
  command: "a2dissite {{ scan_domain }}-le-ssl.conf"
  args:
    removes: "/etc/apache2/sites-enabled/{{ scan_domain }}-le-ssl.conf"
  notify: reload apache
