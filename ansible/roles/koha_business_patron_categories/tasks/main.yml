# ============================================================================
# ROLE: koha_business_patron_categories
# ----------------------------------------------------------------------------
# Verantwoordelijkheid:
# Definieert lezerscategorieën binnen Koha.
#
# Doet wel:
# - aanmaken en bijwerken van patron categories
#
# Doet niet:
# - individuele lezers of medewerkers aanmaken
# ============================================================================

- name: Assert Koha runtime facts exist
  assert:
    that:
      - ansible_local.koha is defined
      - ansible_local.koha.db_name is defined
      - ansible_local.koha.db_user is defined
      - ansible_local.koha.db_pass is defined
    fail_msg: "Koha runtime facts are missing; instance not initialized yet"

- name: Ensure patron categories
  community.mysql.mysql_query:
    login_db: "{{ ansible_local.koha.db_name }}"
    login_user: "{{ ansible_local.koha.db_user }}"
    login_password: "{{ ansible_local.koha.db_pass }}"
    query: |
      INSERT INTO categories
        (categorycode, description, enrolmentperiod, upperagelimit, category_type)
      VALUES
        ('{{ item.code }}',
         '{{ item.description }}',
         {{ item.enrolment_period }},
         {{ item.upper_age_limit }},
         '{{ item.category_type }}')
      ON DUPLICATE KEY UPDATE
        description    = VALUES(description),
        enrolmentperiod = VALUES(enrolmentperiod),
        upperagelimit  = VALUES(upperagelimit),
        category_type  = VALUES(category_type);
  loop: "{{ koha_patron_categories }}"