# ============================================================================
# 07-koha-business.yml
# ----------------------------------------------------------------------------
# Doel:
# Inrichten van bibliotheeklogica los van techniek.
#
# Scope:
# - language packs (NL/FR/EN)
# - libraries
# - patron categorieën
# - item types
# - circulation rules
# - authorised values
# - systeempreferenties
# - staff accounts
# - admin account
# ============================================================================

- name: Koha business configuration
  hosts: all
  become: true

  roles:
    # Installeert Koha interface-vertalingen (NL/FR/EN).
    # MOET vóór koha_business_sysprefs draaien omdat OPACLanguages
    # anders waarden activeert die niet als translation files bestaan.
    - koha_languages

    # Definieert bibliotheken en branches
    - koha_business_libraries

    # Lezerscategorieën (Staff, Volwassene, Jeugd)
    - koha_business_patron_categories

    # Materiaalsoorten (Boek; DVD en CD uitgecommentarieerd)
    - koha_business_item_types

    # Configureert authorised values
    - koha_business_authorised_values

    # Uitleenregels en circulatiebeleid
    - koha_business_circulation

    # Systeempreferenties (URLs, taal, catalogus, privacy)
    - koha_business_sysprefs

    # Medewerkers met login en permissies
    - koha_business_staff

    # Beheeraccounts en superlibrarian permissies
    - koha_business_admin